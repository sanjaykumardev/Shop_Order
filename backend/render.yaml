# Render blueprint for the Django API backend.
#
# To deploy: push this repo to GitHub, then in Render (render.com)
# choose "New + -> Blueprint" and select this repository. Render reads
# this file and creates the web service automatically.
#
# After the service is created:
#   1. Set DATABASE_URL  -> your Supabase connection string (Settings -> Database -> URI)
#   2. Set CORS_ALLOWED_ORIGINS -> https://<your-frontend>.vercel.app
#   3. The service runs `migrate` on build, so the Supabase schema is created.
#   4. Create the owner/admin account:
#        Render -> service -> Shell:
#        python manage.py createsuperuser
#      (or do it from your machine against the same Supabase DB first).

services:
  - type: web
    name: shop-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
